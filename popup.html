<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="status">
    Listener: <b id="state" class="off">OFF</b> | 
    Status: <b id="lockStatus" class="new-user">NEW USER</b>
  </div>
  <button id="toggleBtn">Toggle Listener</button>
  <hr>
  <input type="password" id="pwd" placeholder="Password">
  <!-- This button text will change dynamically -->
  <button id="unlockBtn">Set Master Password</button> 
  <div id="dangerZone">
    <p style="font-size: 10px; color: red;">Forgotten password? This wipes all data:</p>
    <button id="resetVault" class="resetVault">Wipe & Reset Vault</button>
  </div>
  <hr>
  <button id="exportBtn">Export Vault (Encrypted)</button>
  <button id="importBtn">Import Vault</button>
  <input type="file" id="fileInput" style="display:none">
  <script src="crypto-util.js"></script>
  <script src="popup.js"></script>
</body>
</html>
